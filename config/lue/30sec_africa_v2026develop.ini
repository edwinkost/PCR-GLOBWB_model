[globalOptions]

lue_scalability_experiment = True

# Please set the pcrglobwb output directory (outputDir) in an absolute path.
#~ outputDir = MAIN_OUTPUT_DIR
# PLEASE CHANGE TO YOURS
#~ outputDir = /scratch-shared/edwin/test_for_toine/africa/
#~ outputDir = /scratch-shared/hydrowld/lue_pgb/africa_30sec/01st_test/
#~ outputDir    = /scratch-shared/hydrowld/lue_pgb/africa_30sec/02nd_test/
#~ outputDir    = /scratch-shared/hydrowld/lue_pgb/africa_30sec/03rd_test_72thr/
#~ outputDir    = /scratch-shared/hydrowld/lue_pgb/africa_30sec/04th_test_48thr/
outputDir   = /scratch-shared/edwin/test_for_egu_2026/africa/

# Set the input directory map in an absolute path. 
# - on snellius
#~ inputDir = /projects/0/dfguu/users/edwin/data/pcrglobwb_input_arise/develop/
inputDir    = /scratch-shared/edwin/input_files_for_toine/

# Map of clone (must be provided in PCRaster maps)
# PLEASE CHANGE TO YOURS
cloneMap    = clone/clone_africa_30sec_9000x9600.map
# DONE

# The area/landmask of interest:
#~ landmask = /projects/0/dfguu/users/edwin/data/pcrglobwb_input_arise/develop/africa_30sec/cloneMaps/version_2020-XX-XX/mask_uganda_195_basin.map
#~ landmask = None
landmask    = clone/clone_africa_30sec_9000x9600.map
# DONE

# netcdf attributes for output files:
institution = Department of Physical Geography, Utrecht University
title       = PCR-GLOBWB 2 output - test
description = test

# Format: YYYY-MM-DD ; The model runs on daily time step.
#~ startTime = STARTING_DATE
#~ endTime   = END_DATE
startTime = 2000-01-01
endTime   = 2000-12-31

# spinning up options:
#~ maxSpinUpsInYears = NUMBER_OF_SPINUP_YEARS
maxSpinUpsInYears = 0
minConvForSoilSto = 0.0
minConvForGwatSto = 0.0
minConvForChanSto = 0.0
minConvForTotlSto = 0.0

# option/directory for saving the spin-up directory 
spinUpOutputDir = True

log_level_file       = CRITICAL
log_level_console    = CRITICAL
log_level_debug_file = CRITICAL


[meteoOptions]

referenceETPotMethod = Input


#~ cdo -L -f nc4 -selyear,2000 africa_referencePotET_gswp3-w5e5_dailyTot_output_2000-2019.nc        africa_referencePotET_gswp3-w5e5_dailyTot_output_2000.nc        &
#~ cdo -L -f nc4 -selyear,2000 africa_w5e5_obsclim_pr_global_daily_2000_2019_version_2021-09-XX.nc  africa_w5e5_obsclim_pr_global_daily_2000_version_2021-09-XX.nc  &
#~ cdo -L -f nc4 -selyear,2000 africa_w5e5_obsclim_tas_global_daily_2000_2019_version_2021-09-XX.nc africa_w5e5_obsclim_tas_global_daily_2000_version_2021-09-XX.nc &


precipitationNC = /scratch-shared/edwin/input_files_for_toine/africa_30sec_forcing/w5e5/africa_w5e5_obsclim_pr_global_daily_2000_version_2021-09-XX_2000.nc
temperatureNC   = /scratch-shared/edwin/input_files_for_toine/africa_30sec_forcing/w5e5/africa_w5e5_obsclim_tas_global_daily_2000_version_2021-09-XX_2000.nc
refETPotFileNC  = /scratch-shared/edwin/input_files_for_toine/africa_30sec_forcing/w5e5/africa_referencePotET_gswp3-w5e5_dailyTot_output_2000.nc

# variable names in the forcing files
precipitationVariableName = pr
temperatureVariableName   = tas
referenceEPotVariableName = reference_potential_evaporation

# conversion constants and factors to correct forcing values (optional) so that the units are in m.day-1 and degree Celcius                                                                                                           
precipitationConstant    = 0.0
precipitationFactor      = 86.4
temperatureConstant      = -273.15
temperatureFactor        = 1.0
referenceEPotConstant = 0.0
referenceEPotFactor   = 1.0


# initial conditions - dummy - not really required
avgAnnualDiurnalDeltaTempIni = 0.0
avgAnnualPrecipitationIni    = 0.0
avgAnnualTemperatureIni      = 0.0



[landSurfaceOptions]

debugWaterBalance = True

numberOfUpperSoilLayers = 2

# topography parameters
# - they are used for all land cover types, unless they are are defined in certain land cover type options 
#   (e.g. different/various soil types for agriculture areas)  
topographyNC = pgb_soil_and_topo_30sec_africa_v202102_complete/topography_parameters_30sec_february_2021_africa.nc
# DONE


# soil parameters
soilPropertiesNC = pgb_soil_and_topo_30sec_africa_v202102_complete/pgb_soil_30sec_africa_v202102_complete.nc
# DONE

# land cover classes
landCoverTypes = naturalVegetationAndRainFedCrops

# we have to correct land cover fractions
noLandCoverFractionCorrection = False

# option to skip extrapolation
noParameterExtrapolation = True


[naturalVegetationAndRainFedCropsOptions]
name = naturalVegetationAndRainFedCrops
debugWaterBalance = True

# snow module properties
snowModuleType      =  Simple
freezingT           =  0.0
degreeDayFactor     =  0.0055
snowWaterHoldingCap =  0.1
refreezingCoeff     =  0.05

# other paramater values
minTopWaterLayer  = 0.0
minCropKC         = 0.2

cropCoefficientNC = landCover/naturalVegetationAndRainFedCrops/version_2020-12-XX/composite-short-n-tall_crop_coefficient.nc
interceptCapNC    = landCover/naturalVegetationAndRainFedCrops/version_2020-12-XX/composite-short-n-tall_intercept_capacity.nc
coverFractionNC   = landCover/naturalVegetationAndRainFedCrops/version_2020-12-XX/composite-short-n-tall_cover_fraction.nc
# DONE

landCoverMapsNC   = None
# If NC file is not provided, we have to provide the following pcraster maps:
fracVegCover      = 1.0
minSoilDepthFrac  = 0.99
maxSoilDepthFrac  = 1.01
rootFraction1     = landCover/naturalVegetationAndRainFedCrops/version_2020-12-XX/rfrac1_all.nc
rootFraction2     = landCover/naturalVegetationAndRainFedCrops/version_2020-12-XX/rfrac2_all.nc	
maxRootDepth      = landCover/naturalVegetationAndRainFedCrops/version_2020-12-XX/meanrootdepth_all.nc
# Note: The maxRootDepth is not used for non irrigated land cover types. 	
#
# Parameters for the Arno's scheme:
arnoBeta = None
# If arnoBeta is defined, the soil water capacity distribution is based on this.
# If arnoBeta is NOT defined, minSoilDepthFrac and maxSoilDepthFrac must be defined such that arnoBeta will be calculated based on maxSoilDepthFrac and minSoilDepthFrac.

# initial conditions:
interceptStorIni = 0.0
snowCoverSWEIni  = 0.0
snowFreeWaterIni = 0.0
topWaterLayerIni = 0.0
storUppIni       = 0.2
storLowIni       = 0.2
interflowIni     = 0.0


noParameterExtrapolation = True


# output files that will be written in the disk in netcdf files:
# - daily resolution
#~ outDailyTotNC = satAreaFrac
outDailyTotNC = None
outMonthTotNC = None
outMonthAvgNC = satAreaFrac
outMonthEndNC = None


[groundwaterOptions]
debugWaterBalance = True

groundwaterPropertiesNC = None
#
#~ recessionCoeff = groundwater/africa_recession_coefficient_30sec_filled_v20231205_correctlats.nc
#~ kSatAquifer    = groundwater/africa_k_conductivity_aquifer_30sec_filled_v20231205_correctlats.nc
#~ specificYield  = groundwater/africa_specific_yield_aquifer_30sec_filled_v20231205_correctlats.nc
#
recessionCoeff = 0.1
kSatAquifer    = 0.1
specificYield  = 0.1
#
# minimum value for groundwater recession coefficient (day-1) 
# - about 11 years
minRecessionCoeff = 0.00025
#~ # - about 27 years
#~ minRecessionCoeff = 1.0e-4

# some options for constraining groundwater abstraction
limitFossilGroundWaterAbstraction      = True
estimateOfRenewableGroundwaterCapacity = 0.0
estimateOfTotalGroundwaterThickness    = 1000.
minimumTotalGroundwaterThickness       = 100.
maximumTotalGroundwaterThickness       = None

doNotExtrapolateThickness = True
noParameterExtrapolation  = True



# initial conditions:
storGroundwaterFossilIni                     = 0.0
storGroundwaterIni                           = 0.0
avgNonFossilGroundwaterAllocationLongIni     = 0.0
avgNonFossilGroundwaterAllocationShortIni    = 0.0
avgTotalGroundwaterAbstractionIni            = 0.0
avgTotalGroundwaterAllocationLongIni         = 0.0
avgTotalGroundwaterAllocationShortIni        = 0.0
relativeGroundwaterHeadIni                   = 0.0
baseflowIni                                  = 0.0
avgStorGroundwaterIni                        = 0.0


[routingOptions]

debugWaterBalance = True

# drainage direction map
#~ lddMap = 5
lddMap = routing/africa_lddsound_30sec_version_202005XX_correct_lat.nc.map

# option to skip lddrepair and lddmask (note: for this, a ldd pcraster map at the clone extent will be needed as the input for "lddMap")
skip_ldd_repair_and_ldd_mask = True

# cell area (unit: m2)
#~ cellAreaMap = routing/africa_cdo_grid_area_30sec_map_correct_lat.nc
cellAreaMap = 1000000.

# routing method:
#~ routingMethod = accuTravelTime
routingMethod    = kinematicWave

#~ # maximum number of sub time steps for the kinematic wave
#~ maxiumNumberOfSubTimeSteps = 96

# maximum number of sub time steps for the kinematic wave
maxiumNumberOfSubTimeSteps = 1

allow_negative_storage_due_to_evaporation = True

# manning coefficient
manningsN   = 0.04

# Option for flood plain simulation
dynamicFloodPlain = False

# channel gradient
gradient          = 0.001
#~ gradient             = routing/africa_channel_gradient_channel_parameters_30sec_february_2021_global_covered_with_zero.nc

# constant channel depth 
constantChannelDepth = 2.
#~ constantChannelDepth = routing/africa_bankfull_depth_channel_parameters_30sec_february_2021_global_covered_with_zero.nc

# constant channel width (optional)
constantChannelWidth = 20.
#~ constantChannelWidth = routing/africa_bankfull_width_channel_parameters_30sec_february_2021_global_covered_with_zero.nc

# minimum channel width (optional)
minimumChannelWidth  = 20.
#~ minimumChannelWidth  = routing/africa_bankfull_width_channel_parameters_30sec_february_2021_global_covered_with_zero.nc

# channel properties for flooding
bankfullCapacity     = None
# - If None, it will be estimated from (bankfull) channel depth (m) and width (m) 

# composite crop factors for WaterBodies: 
cropCoefficientWaterNC    = routing/africa_30sec_cropCoefficientForOpenWater.nc
minCropWaterKC            = 1.00


# lake and reservoir parameters
# - set the following None for the LUE experiement
waterBodyInputNC  = None  
fracWaterInp      = None
waterBodyIds      = None
waterBodyTyp      = None
resMaxCapInp      = None
resSfAreaInp      = None
# - this is somehow need to be defined
onlyNaturalWaterBodies = True

# using static fraction water
#~ fracWaterInpStatic = 0.0
fracWaterInpStatic = routing/africa_fracWaterInp_lakes_and_reservoirs_30sec_global_2019_version_202005XX.nc

#~ # using pre-defined files for water body ids and their outlets (in order to skip the pcraster operations of subcatchment and areaorder)
#~ correct_water_body_outlets = /eejit/depfg/sutan101/data/data_for_lue_test/create_water_bodies_for_lue_test/maps/water_body_outlets_boolean.map
#~ correct_water_body_ids     = /eejit/depfg/sutan101/data/data_for_lue_test/create_water_bodies_for_lue_test/maps/water_body_ids_nominal.map

correct_water_body_outlets = None
correct_water_body_ids     = None


# initial conditions:
waterBodyStorageIni            = 0.0
channelStorageIni              = 0.0
readAvlChannelStorageIni       = 0.0
avgDischargeLongIni            = 0.0
avgDischargeShortIni           = 0.0
m2tDischargeLongIni            = 0.0
avgBaseflowLongIni             = 0.0
riverbedExchangeIni            = 0.0
subDischargeIni                = 0.0
avgLakeReservoirInflowShortIni = 0.0
avgLakeReservoirOutflowLongIni = 0.0
timestepsToAvgDischargeIni     = 0.0

[reportingOptions]

# landmask for reporting
landmask_for_reporting    = None

# output files that will be written in the disk in netcdf files:
# - daily resolution
#~ outDailyTotNC = satDegUpp,satDegLow,gwRecharge,storUppTotal,storLowTotal,discharge
outDailyTotNC = None
outMonthTotNC = runoff,totalRunoff,directRunoff,interflowTotal,baseflow,gwRecharge,actualET,totalEvaporation,waterBodyActEvaporation
#~ outMonthTotNC = interceptEvap,topWaterLayerEvap,actBareSoilEvap,irrGrossDemand,actTranspiUppTotal,actTranspiLowTotal,directRunoff,interflowTotal,waterBodyActEvaporation,baseflow,surfaceWaterInf,surfaceWaterAbstraction,nonIrrReturnFlow,nonIrrGrossDemand,irrGrossDemand,desalinationAbstraction,fossilGroundwaterAbstraction,nonFossilGroundwaterAbstraction,irrPaddyWaterWithdrawal,irrNonPaddyWaterWithdrawal,domesticWaterWithdrawal,industryWaterWithdrawal,livestockWaterWithdrawal,precipitation,referencePotET
outMonthAvgNC = storUppTotal,storLowTotal,satDegUpp,satDegLow
outMonthEndNC = dynamicFracWat

