[globalOptions]

# Please set the pcrglobwb output directory (outputDir) in an absolute path.
outputDir    = /gpfs/home4/tgerard/PCR-GLOBWB_model/output

# Please set the clone map file (cloneMap), which defines the spatial resolution and extent of your study area.
# - Please make sure that the file is stored locally in your computing machine.
# - The file must be in the pcraster format.
cloneMap    = /gpfs/home4/tgerard/PCR-GLOBWB_model/Input/clone/clone.map


# Set the input directory map in an absolute path. The input forcing and parameter directories and files will be relative to this.
#~ #  - the old input dir
#~ inputDir = /projects/0/dfguu/data/hydroworld/pcrglobwb2_input_release/version_2019_11_beta_extended/pcrglobwb2_input/
#  - updated input dir, based on the Aqueduct runs
inputDir    = /projects/0/dfguu/users/edwin/data/pcrglobwb_input_aqueduct/version_2021-09-16/


# The area/landmask of interest:
# If None, area/landmask is limited for cells with ldd value. 
landmask    = /gpfs/home4/tgerard/PCR-GLOBWB_model/Input/Landmask/mask_catchment_brazil.map


# netcdf attributes for output files:
institution = Department of Physical Geography, Utrecht University
title       = PCR-GLOBWB 2 output, with human factors (non-natural)
description = PCR-GLOBWB run with human factors (non-natural) at 5 arcmin resolution

# Format: YYYY-MM-DD ; The model runs on daily time step.
startTime = 1979-01-01
endTime   = 2019-12-31

# spinning up options:
maxSpinUpsInYears = 20
minConvForSoilSto = 0.0
minConvForGwatSto = 0.0
minConvForChanSto = 0.0
minConvForTotlSto = 0.0


[meteoOptions]


#~ # Set the forcing temperature and precipitation files (relative to inputDir)
#~ precipitationNC = global_30min/meteo/forcing/daily_precipitation_cru_era-interim_1979_to_2010.nc
#~ temperatureNC   = global_30min/meteo/forcing/daily_temperature_cru_era-interim_1979_to_2010.nc

#~ # Method to calculate referencePotETP (reference potential evaporation+transpiration)
#~ # options are "Hamon" and "Input" ; If "Input", the netcdf input file must be given:
#~ referenceETPotMethod = Input
#~ refETPotFileNC  = global_30min/meteo/forcing/daily_referencePotET_cru_era-interim_1979_to_2010.nc

# - historical based on the observed meteorological forcing: W5E5
precipitationNC = /projects/0/dfguu/users/edwin/data/isimip_forcing/isimip3a_version_2021-09-XX/copied_on_2021-09-XX/GSWP3-W5E5/merged/w5e5_1979-2019_with_climatology_on_1978/gswp3-w5e5_obsclim_pr_global_daily_1979-2019_version_2021-09-XX_with_climatology_on_1978.nc
temperatureNC   = /projects/0/dfguu/users/edwin/data/isimip_forcing/isimip3a_version_2021-09-XX/copied_on_2021-09-XX/GSWP3-W5E5/merged/w5e5_1979-2019_with_climatology_on_1978/gswp3-w5e5_obsclim_tas_global_daily_1979-2019_version_2021-09-XX_with_climatology_on_1978.nc
referenceETPotMethod = Input
refETPotFileNC  = /scratch-shared/hydrowld/pcrglobwb_wri_aqueduct_2021_et0_daily_merged/referencePotET_gswp3-w5e5_dailyTot_output_1960-2019.nc

# For the future projection forcing (5 GCMs and 3 SSPs/RCPs), the files are on
# - pr and tas: /projects/0/dfguu/users/edwin/data/isimip_forcing/isimip3b_version_2021-05-XX/copied_on_2021-06-XX/merged/ssp*/*/
# - refETPotFileNC: /scratch-shared/hydrowld/pcrglobwb_wri_aqueduct_2021_et0_daily_merged

# conversion constants and factors to correct forcing values (optional) so that the units are in m.day-1 and degree Celcius                                                                                                           
precipitationConstant    = 0.0
precipitationFactor      = 86.4
temperatureConstant      = -273.15
temperatureFactor        = 1.0


[meteoDownscalingOptions]
# This section is for a 5 arcmin run, for downscaling meteorological forcing at 30 arcmin to 5 arcmin.  
                                                                                                                                        
downscalePrecipitation  = False                                                                                                                                   
downscaleTemperature    = True                                                                                                                                   
downscaleReferenceETPot = False                                                                                                                                   
   
# downscaling (based on the digital elevation model):                                                                                                            
# The downscaling will be performed by providing the "cellIds" (meteoDownscaleIds) of lower resolution cells.                                                    
meteoDownscaleIds = general/uniqueIds_30min.nc                                                                      
highResolutionDEM = general/dem_average_topography_parameters_5min_april_2021_global_covered_with_zero.nc                                                                           
   
# lapse rates:                                                                                                                                                   
temperLapseRateNC = general/temperature_slope.nc                                                                     
precipLapseRateNC = general/precipitation_slope.nc                                                                   
                                                                                                                                                                 
# downscaling criteria (TODO: remove these):                                                                                                                     
temperatCorrelNC  = general/temperature_correl.nc                                                                     
precipitCorrelNC  = general/precipitation_correl.nc                                                                   
                                                                                                                                                                 
# windows length (unit: arc-degree) for smoothing/averaging forcing data (not recommended):                                                                      
smoothingWindowsLength = 0


[landSurfaceOptions]

debugWaterBalance = True

numberOfUpperSoilLayers = 2

# soil and parameters
# - they are used for all land cover types, unless they are are defined in certain land cover type options 
#   (e.g. different/various soil types for agriculture areas)  
