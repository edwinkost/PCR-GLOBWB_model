[globalOptions]


# Set the pcrglobwb output directory in an absolute path.
#~ outputDir = MAIN_OUTPUT_DIRECTORY
#~ outputDir = /scratch/depfg/sutan101/test_pgb_watersis/hamon_global/
#~ outputDir = /scratch/depfg/sutan101/test_pgb_watersis/hamon_miss/
outputDir    = /scratch/depfg/sutan101/test_pgb_watersis/europe_5km_test_with_gmd_paper_forcing/

# Set the input directory map in an absolute path . 
