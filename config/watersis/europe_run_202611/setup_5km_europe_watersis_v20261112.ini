[globalOptions]


# Set the pcrglobwb output directory in an absolute path.
#~ outputDir = MAIN_OUTPUT_DIRECTORY
#~ outputDir = /scratch/depfg/sutan101/watersis_runs_202609XX/europe_5km_v20260905_using_pcraster4.4.3_numpy1.26.4/
outputDir    = /scratch-shared/edwin/watersis_runs_202611/europe_5km_with_watersis_forcing_reanalysis_v20261112/

# Set the input directory map in an absolute path . 
#~ inputDir  = /scratch/depfg/sutan101_new/pcrglobwb_input_watersis/develop/europe_5km/
#~ inputDir  = /ec/fws4/sb/project/C3SHydroGL/edwin/pcrglobwb_input_watersis/develop/europe_5km/
inputDir     = /scratch-shared/edwin/data/pcrglobwb_input_watersis/release/europe_5km_v20261005/

# Map of clone (must be provided in PCRaster maps)
cloneMap     = europe_5km_landmask_v20260910.map


# The area/landmask of interest:
# If None, area/landmask is limited for cells with ldd value. 
#~ landmask  = None
landmask     = europe_5km_landmask_v20260910.map


# netcdf attributes for output files:
institution = Department of Physical Geography, Utrecht University
title       = PCR-GLOBWB 2 output without human factors (naturalized) - version for the WaterSIS project - Europe 5km - MAIN_OUTPUT_DIR
description = by Edwin H. Sutanudjaja (contact: e.h.sutanudjaja@uu.nl)


# starting and end dates
#~ startTime = STARTING_DATE
#~ endTime   = END_DATE
startTime    = 1990-01-01
endTime      = 2023-12-31


#~ # spinning up options:
#~ maxSpinUpsInYears    = NUMBER_OF_SPINUP_YEARS
#~ minConvForSoilSto    = 0.0
#~ minConvForGwatSto    = 0.0
#~ minConvForChanSto    = 0.0
#~ minConvForTotlSto    = 0.0

maxSpinUpsInYears    = 25
minConvForSoilSto    = 0.0
minConvForGwatSto    = 0.0
minConvForChanSto    = 0.0
minConvForTotlSto    = 0.0

# option/directory for saving the spin-up directory 
spinUpOutputDir = True


# By default, run changes the "cwd" to "mapsDir" (inputDir/maps/); Set the following to True to skip this behaviour. 
keep_cwd = True


[meteoOptions]

# Set the forcing temperature and precipitation files
precipitationNC      = /scratch-shared/edwingwt/data/watersis_forcing/europe/v20261105/europe_pr_1990_2023_5km_v20261105.nc
temperatureNC        = /scratch-shared/edwingwt/data/watersis_forcing/europe/v20261105/europe_tas_1990_2023_5km_v20261105.nc

# Reference potential evaporation using the input file
referenceETPotMethod = Input
refETPotFileNC       = /scratch-shared/edwingwt/data/watersis_forcing/europe/v20261105/europe_pet_1990_2023_5km_v20261105.nc

#~ edwin@tcn531.local.snellius.surf.nl:/scratch-shared/edwingwt/data/watersis_forcing/europe/v20261105$ ls -lah
#~ total 132G
#~ drwxr-xr-x+ 2 edwingwt edwingwt 4.0K Nov 12 10:42 .
#~ drwxr-xr-x+ 3 edwingwt edwingwt 4.0K Nov 12 10:42 ..
#~ -rw-r--r--. 1 edwingwt edwingwt  44G Nov 12 10:42 europe_pet_1990_2023_5km_v20261105.nc
#~ -rw-r--r--. 1 edwingwt edwingwt  44G Nov 12 10:42 europe_pr_1990_2023_5km_v20261105.nc
#~ -rw-r--r--. 1 edwingwt edwingwt  44G Nov 12 10:42 europe_tas_1990_2023_5km_v20261105.nc
#~ -rw-r--r--. 1 edwingwt edwingwt  403 Nov 12 10:42 merging_europe_forcing.sh
#~ -rw-r--r--. 1 edwingwt edwingwt  117 Nov 12 10:42 upload_europe_forcing_to_snel_edwingwt.sh

#~ # conversion constants and factors to correct forcing values (optional) so that the units are in m.day-1 and degree Celcius                                                                                                           
#~ precipitationConstant    = 0.0
#~ precipitationFactor      = 0.001
#~ temperatureConstant      = 0.0
#~ temperatureFactor        = 1.0
#~ referenceEPotConstant    = 0.0
#~ referenceEPotFactor      = 0.001 

#~ precipitation_file_per_month     = True
#~ temperature_file_per_month       = True
#~ refETPotFileNC_file_per_month    = True

precipitationVariableName  = pr
temperatureVariableName    = tas
referenceEPotVariableName  = pet

# kg m-2 s-1 -> m day-1
precipitationConstant      = 0.0
precipitationFactor        = 86.4
referenceEPotConstant      = 0.0
referenceEPotFactor        = 86.4

# K -> degrees Celsius
temperatureConstant        = -273.15
temperatureFactor          = 1.0

rounddownPrecipitation     = False


