[globalOptions]
outputDir            = output
keep_cwd             = True
inputDir             = input
cloneMap             = static_data/europe_5km_landmask_v20260910.map
landmask             = static_data/europe_5km_landmask_v20260910.map
institution          = Department of Physical Geography, Utrecht University
title                = PCR-GLOBWB output without human factors (naturalized), development version for WaterSIS, Europe 5km
description          = by Edwin H. Sutanudjaja (contact: e.h.sutanudjaja@uu.nl)
startTime            = STARTING_DATE
endTime              = END_DATE
minConvForSoilSto    = 0.0
minConvForGwatSto    = 0.0
minConvForChanSto    = 0.0
minConvForTotlSto    = 0.0
maxSpinUpsInYears    = 0

[meteoOptions]
referenceETPotMethod       = Input
precipitationNC            = meteo/pre.nc
temperatureNC              = meteo/tavg.nc
refETPotFileNC             = meteo/pet.nc

precipitationVariableName  = pr
temperatureVariableName    = tas
referenceEPotVariableName  = pet

# kg m-2 s-1 -> m day-1
precipitationConstant      = 0.0
precipitationFactor        = 86.4
referenceEPotConstant      = 0.0
referenceEPotFactor        = 86.4

# K -> degrees Celsius
temperatureConstant        = -273.15
temperatureFactor          = 1.0

rounddownPrecipitation     = False


[landSurfaceOptions]

debugWaterBalance             = True
numberOfUpperSoilLayers       = 2
topographyNC                  = static_data/topography_parameters_5km_europe_watersis_v20260311.nc
soilPropertiesNC              = None
# - if soilPropertiesNC = None, the following soil parameters will be used
firstStorDepth                = 0.30
secondStorDepth               = 1.20
#
soilWaterStorageCap1          = CALC
soilWaterStorageCap2          = CALC
#
airEntryValue1                = static_data/psiAir_average_1_eu_watersis_europe_5km.nc
airEntryValue2                = static_data/psiAir_average_2_eu_watersis_europe_5km.nc
poreSizeBeta1                 = static_data/BCH_average_1_eu_watersis_europe_5km.nc
poreSizeBeta2                 = static_data/BCH_average_2_eu_watersis_europe_5km.nc
resVolWC1                     = 0.0
resVolWC2                     = 0.0
satVolWC1                     = static_data/vmcSat_average_1_eu_watersis_europe_5km.nc
satVolWC2                     = static_data/vmcSat_average_2_eu_watersis_europe_5km.nc
KSat1                         = static_data/kSat_average_1_eu_watersis_europe_5km.nc
KSat2                         = static_data/kSat_average_2_eu_watersis_europe_5km.nc
percolationImp                = static_data/europe_5km_impeded_drainage_permafrost_nsidc_dsmw_v20260306.nc
noParameterExtrapolation      = True
landCoverTypes                = forest,grassland
noLandCoverFractionCorrection = False


[forestOptions]
name                     = forest
debugWaterBalance        = True
snowModuleType           = Simple
freezingT                = 0.0
snowWaterHoldingCap      = 0.1
refreezingCoeff          = 0.05
degreeDayFactor          = 0.0055
minTopWaterLayer         = 0.0
minInterceptCap          = 0.0002
minCropKC                = 0.2
cropCoefficientNC        = static_data/europe_5km_tall_crop_coefficient.nc
interceptCapNC           = static_data/europe_5km_tall_intercept_capacity.nc
coverFractionNC          = static_data/europe_5km_tall_cover_fraction.nc
landCoverMapsNC          = None
fracVegCover             = static_data/europe_5km_vegf_tall.map
minSoilDepthFrac         = static_data/europe_5km_minf_tall.map
maxSoilDepthFrac         = static_data/europe_5km_maxf_tall.map
rootFraction1            = static_data/europe_5km_rfrac1_tall.map
rootFraction2            = static_data/europe_5km_rfrac2_tall.map
maxRootDepth             = 1.0
arnoBeta                 = None
noParameterExtrapolation = True
interceptStorIni         = ${WORK_DIR}/input/restart/interceptStor_forest_${prev_yend}-${prev_mend}-${prev_dend}.map
snowCoverSWEIni          = ${WORK_DIR}/input/restart/snowCoverSWE_forest_${prev_yend}-${prev_mend}-${prev_dend}.map
snowFreeWaterIni         = ${WORK_DIR}/input/restart/snowFreeWater_forest_${prev_yend}-${prev_mend}-${prev_dend}.map
topWaterLayerIni         = ${WORK_DIR}/input/restart/topWaterLayer_forest_${prev_yend}-${prev_mend}-${prev_dend}.map
storUppIni               = ${WORK_DIR}/input/restart/storUpp_forest_${prev_yend}-${prev_mend}-${prev_dend}.map
storLowIni               = ${WORK_DIR}/input/restart/storLow_forest_${prev_yend}-${prev_mend}-${prev_dend}.map
interflowIni             = ${WORK_DIR}/input/restart/interflow_forest_${prev_yend}-${prev_mend}-${prev_dend}.map

[grasslandOptions]
name                     = grassland
debugWaterBalance        = True
snowModuleType           = Simple
freezingT                = 0.0
snowWaterHoldingCap      = 0.1
refreezingCoeff          = 0.05
degreeDayFactor          = 0.0055
minTopWaterLayer         = 0.0
minInterceptCap          = 0.0002
minCropKC                = 0.2
cropCoefficientNC        = static_data/europe_5km_short_crop_coefficient.nc
interceptCapNC           = static_data/europe_5km_short_intercept_capacity.nc
coverFractionNC          = static_data/europe_5km_short_cover_fraction.nc
landCoverMapsNC          = None
fracVegCover             = static_data/europe_5km_vegf_short.map
minSoilDepthFrac         = static_data/europe_5km_minf_short.map
maxSoilDepthFrac         = static_data/europe_5km_maxf_short.map
rootFraction1            = static_data/europe_5km_rfrac1_short.map
rootFraction2            = static_data/europe_5km_rfrac2_short.map
maxRootDepth             = 0.5
arnoBeta                 = None
noParameterExtrapolation = True
interceptStorIni         = ${WORK_DIR}/input/restart/interceptStor_grassland_${prev_yend}-${prev_mend}-${prev_dend}.map
snowCoverSWEIni          = ${WORK_DIR}/input/restart/snowCoverSWE_grassland_${prev_yend}-${prev_mend}-${prev_dend}.map
snowFreeWaterIni         = ${WORK_DIR}/input/restart/snowFreeWater_grassland_${prev_yend}-${prev_mend}-${prev_dend}.map
topWaterLayerIni         = ${WORK_DIR}/input/restart/topWaterLayer_grassland_${prev_yend}-${prev_mend}-${prev_dend}.map
storUppIni               = ${WORK_DIR}/input/restart/storUpp_grassland_${prev_yend}-${prev_mend}-${prev_dend}.map
storLowIni               = ${WORK_DIR}/input/restart/storLow_grassland_${prev_yend}-${prev_mend}-${prev_dend}.map
interflowIni             = ${WORK_DIR}/input/restart/interflow_grassland_${prev_yend}-${prev_mend}-${prev_dend}.map


[groundwaterOptions]
debugWaterBalance                         = True
groundwaterPropertiesNC                   = None
recessionCoeff                            = static_data/europe_5km_recession_coefficient_v20260309_sqrt.map
specificYield                             = static_data/europe_5km_specific_yield_aquifer_v20260309.map
kSatAquifer                               = static_data/europe_5km_k_conductivity_aquifer_v20260309.map
minRecessionCoeff                         = 0.00025
baseflow_exponent                         = 1.5
doNotExtrapolateThickness                 = True
noParameterExtrapolation                  = True
storGroundwaterIni                        = ${WORK_DIR}/input/restart/storGroundwater_${prev_yend}-${prev_mend}-${prev_dend}.map
avgStorGroundwaterIni                     = ${WORK_DIR}/input/restart/avgStorGroundwater_${prev_yend}-${prev_mend}-${prev_dend}.map
storGroundwaterFossilIni                  = ${WORK_DIR}/input/restart/storGroundwaterFossil_${prev_yend}-${prev_mend}-${prev_dend}.map
avgNonFossilGroundwaterAllocationLongIni  = ${WORK_DIR}/input/restart/avgNonFossilGroundwaterAllocationLong_${prev_yend}-${prev_mend}-${prev_dend}.map
avgNonFossilGroundwaterAllocationShortIni = ${WORK_DIR}/input/restart/avgNonFossilGroundwaterAllocationShort_${prev_yend}-${prev_mend}-${prev_dend}.map
avgTotalGroundwaterAbstractionIni         = ${WORK_DIR}/input/restart/avgTotalGroundwaterAbstraction_${prev_yend}-${prev_mend}-${prev_dend}.map
avgTotalGroundwaterAllocationLongIni      = ${WORK_DIR}/input/restart/avgTotalGroundwaterAllocationLong_${prev_yend}-${prev_mend}-${prev_dend}.map
avgTotalGroundwaterAllocationShortIni     = ${WORK_DIR}/input/restart/avgTotalGroundwaterAllocationShort_${prev_yend}-${prev_mend}-${prev_dend}.map
relativeGroundwaterHeadIni                = ${WORK_DIR}/input/restart/relativeGroundwaterHead_${prev_yend}-${prev_mend}-${prev_dend}.map
baseflowIni                               = ${WORK_DIR}/input/restart/baseflow_${prev_yend}-${prev_mend}-${prev_dend}.map


[routingOptions]
debugWaterBalance                       = True
lddMap                                  = static_data/ldd.map
cellAreaMap                             = 25000000
routingMethod                           = accuTravelTime
manningsN                               = 0.04
dynamicFloodPlain                       = False
gradient                                = static_data/changrad.nc.map
constantChannelDepth                    = static_data/chanbnkf.nc.map
constantChannelWidth                    = static_data/chanbw.nc.map
minimumChannelWidth                     = static_data/chanbw.nc.map
channelLength                           = static_data/chanlength.nc.map
bankfullCapacity                        = None
cropCoefficientWaterNC                  = static_data/europe_5km_cropCoefficientForOpenWater.nc
minCropWaterKC                          = 1.00
includeWaterBodies                      = True
waterBodyInputNC                        = static_data/dummy_wbs.nc
onlyNaturalWaterBodies                  = False
cover_runoff_and_open_water_evaporation = True
waterBodyStorageIni                     = ${WORK_DIR}/input/restart/waterBodyStorage_${prev_yend}-${prev_mend}-${prev_dend}.map
channelStorageIni                       = ${WORK_DIR}/input/restart/channelStorage_${prev_yend}-${prev_mend}-${prev_dend}.map
readAvlChannelStorageIni                = ${WORK_DIR}/input/restart/readAvlChannelStorage_${prev_yend}-${prev_mend}-${prev_dend}.map
avgDischargeLongIni                     = ${WORK_DIR}/input/restart/avgDischargeLong_${prev_yend}-${prev_mend}-${prev_dend}.map
avgDischargeShortIni                    = ${WORK_DIR}/input/restart/avgDischargeShort_${prev_yend}-${prev_mend}-${prev_dend}.map
m2tDischargeLongIni                     = ${WORK_DIR}/input/restart/m2tDischargeLong_${prev_yend}-${prev_mend}-${prev_dend}.map
avgBaseflowLongIni                      = ${WORK_DIR}/input/restart/avgBaseflowLong_${prev_yend}-${prev_mend}-${prev_dend}.map
riverbedExchangeIni                     = ${WORK_DIR}/input/restart/riverbedExchange_${prev_yend}-${prev_mend}-${prev_dend}.map
subDischargeIni                         = ${WORK_DIR}/input/restart/subDischarge_${prev_yend}-${prev_mend}-${prev_dend}.map
avgLakeReservoirInflowShortIni          = ${WORK_DIR}/input/restart/avgLakeReservoirInflowShort_${prev_yend}-${prev_mend}-${prev_dend}.map
avgLakeReservoirOutflowLongIni          = ${WORK_DIR}/input/restart/avgLakeReservoirOutflowLong_${prev_yend}-${prev_mend}-${prev_dend}.map
timestepsToAvgDischargeIni              = ${WORK_DIR}/input/restart/timestepsToAvgDischarge_${prev_yend}-${prev_mend}-${prev_dend}.map


[reportingOptions]
landmask_for_reporting  = static_data/europe_5km_landmask_v20260910.map
; outDailyTotNC           = ulyssesP,ulyssesET,ulyssesSWE,ulyssesQsm,ulyssesSM,ulyssesQrRunoff,ulyssesDischarge,ulyssessRefPET,ulyssessCropPET,ulyssesSnowFraction,ulyssesSMUpp,ulyssesSMLow,ulyssesTWS,temperature,storUppTotal,storLowTotal
; outDailyTotNC           = ulysses_rzswi_one_meter,ulyssesET,ulyssesSWE,ulyssesQsm,ulyssesSM,ulyssesQrRunoff,ulyssesTWS
outDailyTotNC           = discharge,ulyssesET,ulyssesSWE,ulysses_rzswi_one_meter,ulyssesQrRunoff,ulyssesTWS,storUppTotal,storLowTotal
# TODO: storUppTotal,storLowTotal can be removed as they are not needed?
outMonthTotNC           = precipitation,totalRunoff,totalEvaporation
outMonthAvgNC           = ulyssessRefPET,ulyssessCropPET,ulyssesSnowFraction,ulyssesQsm,ulyssesSM,ulyssesSMUpp,ulyssesSMLow,temperature,discharge,totalWaterStorageThickness
outMonthEndNC           = None
outAnnuaTotNC           = None
outAnnuaAvgNC           = None
