[modificationBasedOnSystemArgumentOptions]

#~ python3 deterministic_runner_ulysses.py ${INI_FILE} debug_parallel ${CLONE_CODE} \
#~ python3 deterministic_runner_ulysses.py ${INI_FILE} debug \
#~ -mod     ${MAIN_OUTPUT_DIRECTORY}      \
#~ -mid     ${MAIN_INPUT_DIRECTORY}       \
#~ -sd      ${STARTING_DATE}              \
#~ -ed      ${END_DATE}                   \
#~ -noyfsu  ${NUM_OF_YEARS_FOR_SPINUP}    \
#~ -pff     ${PRECIPITATION_FORCING_FILE} \
#~ -tff     ${TEMPERATURE_FORCING_FILE}   \
#~ -rpetff  ${REF_POT_ET_FORCING_FILE}    \
#~ -misf    ${MAIN_INITIAL_STATE_FOLDER}  \
#~ -dfis    ${DATE_FOR_INITIAL_STATES}    \

# provide a list of system arguments and their corresponding strings that will be replaced in this configuration file
-mod          = MAIN_OUTPUT_DIRECTORY
-mid          = MAIN_INPUT_DIRECTORY
-sd           = STARTING_DATE   
-ed           = END_DATE
-noyfsu       = NUM_OF_YEARS_FOR_SPINUP
-pff          = PRECIPITATION_FORCING_FILE
-tff          = TEMPERATURE_FORCING_FILE
-rpetff       = REF_POT_ET_FORCING_FILE
-misf         = MAIN_INITIAL_STATE_FOLDER  
-dfis         = DATE_FOR_INITIAL_STATES  

[globalOptions]


# Set the pcrglobwb output directory in an absolute path.
outputDir    = MAIN_OUTPUT_DIRECTORY
#~ # - on atos
#~ outputDir = /ec/fws4/sb/project/C3SHydroGL/edwin/pgb_watersis_runs_may_2026/europe_5km/

# Set the input directory map in an absolute path. 
inputDir     = MAIN_INPUT_DIRECTORY
#~ inputDir  = /scratch/depfg/sutan101_new/pcrglobwb_input_watersis/develop/europe_5km/

# Map of clone (must be provided in PCRaster maps)
cloneMap     = landmask_based_on_upArea.nc.map
landmask     = landmask_based_on_upArea.nc.map
# TODO: We still have to wait for the final/fixed version of the landmask from the project/UFZ.


# netcdf attributes for output files:
institution = Department of Physical Geography, Utrecht University
title       = PCR-GLOBWB output without human factors (naturalized), development version for WaterSIS, Europe 5km; MAIN_OUTPUT_DIRECTORY
description = by Edwin H. Sutanudjaja (contact: e.h.sutanudjaja@uu.nl)

startTime = STARTING_DATE
endTime   = END_DATE
#~ startTime    = 1981-01-01
#~ endTime      = 2022-12-31


# spinning up options:
maxSpinUpsInYears    = NUM_OF_YEARS_FOR_SPINUP
#~ maxSpinUpsInYears = 0
minConvForSoilSto    = 0.0
minConvForGwatSto    = 0.0
minConvForChanSto    = 0.0
minConvForTotlSto    = 0.0

# option/directory for saving the spin-up directory 
spinUpOutputDir = True

# By default, run changes the "cwd" to "mapsDir" (inputDir/maps/); Set the following to True to skip this behaviour. 
keep_cwd = True


[meteoOptions]

precipitationNC               = PRECIPITATION_FORCING_FILE
temperatureNC                 = TEMPERATURE_FORCING_FILE
refETPotFileNC                = REF_POT_ET_FORCING_FILE
referenceETPotMethod          = Input

#~ # Set the forcing temperature and precipitation files
#~ precipitationNC      = /scratch/depfg/sutan101/data/watersis_forcing/europe/v20260526/europe_5km_pr_0p05_v20260526.nc
#~ temperatureNC        = /scratch/depfg/sutan101/data/watersis_forcing/europe/v20260526/europe_5km_tas_0p05_v20260526.nc
#~ # Reference potential evaporation using the input file
#~ referenceETPotMethod = Input
#~ refETPotFileNC       = /scratch/depfg/sutan101/data/watersis_forcing/europe/v20260526/europe_5km_pet_hargreaves_samani_0p05_1990-2023_v20260526.nc

# conversion constants and factors to correct forcing values (optional) so that the units are in m.day-1 and degree Celcius                                                                                                           
precipitationConstant    = 0.0
precipitationFactor      = 0.001
temperatureConstant      = 0.0
temperatureFactor        = 1.0
referenceEPotConstant    = 0.0
referenceEPotFactor      = 0.001 


[landSurfaceOptions]

debugWaterBalance = True

numberOfUpperSoilLayers = 2

# soil and parameters
# - they are used for all land cover types, unless they are are defined in certain land cover type options 
#   (e.g. different/various soil types for agriculture areas)  
topographyNC = topography_parameters_5km_europe_watersis_v20260311.nc
# TODO: You may want to update slopeLength.

# - using soilGrids
soilPropertiesNC        = None
# - if soilPropertiesNC = None, the following soil parameters will be used
firstStorDepth          = 0.30
secondStorDepth         = 1.20
#
soilWaterStorageCap1    = CALC
soilWaterStorageCap2    = CALC
#
poreSizeBeta1           = europe_5km_soilgrids_v202604XX/BCH_average_1_eu_watersis_europe_5km.nc
poreSizeBeta2           = europe_5km_soilgrids_v202604XX/BCH_average_2_eu_watersis_europe_5km.nc
KSat1                   = europe_5km_soilgrids_v202604XX/kSat_average_1_eu_watersis_europe_5km.nc
KSat2                   = europe_5km_soilgrids_v202604XX/kSat_average_2_eu_watersis_europe_5km.nc
airEntryValue1          = europe_5km_soilgrids_v202604XX/psiAir_average_1_eu_watersis_europe_5km.nc
airEntryValue2          = europe_5km_soilgrids_v202604XX/psiAir_average_2_eu_watersis_europe_5km.nc
satVolWC1               = europe_5km_soilgrids_v202604XX/vmcSat_average_1_eu_watersis_europe_5km.nc
satVolWC2               = europe_5km_soilgrids_v202604XX/vmcSat_average_2_eu_watersis_europe_5km.nc
resVolWC1               = 0.0
resVolWC2               = 0.0

percolationImp          = europe_5km_impeded_drainage_permafrost_nsidc_dsmw_v20260306.nc
#
noParameterExtrapolation      = True
landCoverTypes                = forest,grassland
noLandCoverFractionCorrection = False


[forestOptions]

name = forest
debugWaterBalance = True

# snow module properties
snowModuleType      =  Simple
freezingT           =  0.0
degreeDayFactor     =  0.0055
snowWaterHoldingCap =  0.1
refreezingCoeff     =  0.05


landCoverMapsNC   = None
# If NC file is not provided, we have to provide the following pcraster maps:

fracVegCover      = land_covers_europe_5km_v202601XX/europe_5km_vegf_tall.map
minSoilDepthFrac  = land_covers_europe_5km_v202601XX/europe_5km_minf_tall.map
maxSoilDepthFrac  = land_covers_europe_5km_v202601XX/europe_5km_maxf_tall.map
rootFraction1     = land_covers_europe_5km_v202601XX/europe_5km_rfrac1_tall.map
rootFraction2     = land_covers_europe_5km_v202601XX/europe_5km_rfrac2_tall.map
maxRootDepth      = 1.0
# Note: The maxRootDepth is not used for non irrigated land cover type. 	
#
# Parameters for the Arno's scheme:
arnoBeta = None
# If arnoBeta is defined, the soil water capacity distribution is based on this.
# If arnoBeta is NOT defined, maxSoilDepthFrac must be defined such that arnoBeta will be calculated based on maxSoilDepthFrac and minSoilDepthFrac.

cropCoefficientNC = land_covers_europe_5km_v202601XX/europe_5km_tall_crop_coefficient.nc
coverFractionNC   = land_covers_europe_5km_v202601XX/europe_5km_tall_cover_fraction.nc
interceptCapNC    = land_covers_europe_5km_v202601XX/europe_5km_tall_intercept_capacity.nc

# other paramater values
minTopWaterLayer  = 0.0
minCropKC         = 0.2
minInterceptCap   = 0.0002

noParameterExtrapolation = True

# initial conditions:
interceptStorIni = MAIN_INITIAL_STATE_FOLDER/interceptStor_forest_DATE_FOR_INITIAL_STATES.map
snowCoverSWEIni  = MAIN_INITIAL_STATE_FOLDER/snowCoverSWE_forest_DATE_FOR_INITIAL_STATES.map
snowFreeWaterIni = MAIN_INITIAL_STATE_FOLDER/snowFreeWater_forest_DATE_FOR_INITIAL_STATES.map
topWaterLayerIni = MAIN_INITIAL_STATE_FOLDER/topWaterLayer_forest_DATE_FOR_INITIAL_STATES.map
storUppIni       = MAIN_INITIAL_STATE_FOLDER/storUpp_forest_DATE_FOR_INITIAL_STATES.map
storLowIni       = MAIN_INITIAL_STATE_FOLDER/storLow_forest_DATE_FOR_INITIAL_STATES.map
interflowIni     = MAIN_INITIAL_STATE_FOLDER/interflow_forest_DATE_FOR_INITIAL_STATES.map


